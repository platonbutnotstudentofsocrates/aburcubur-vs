<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abur Cubur VS — tasarım seçenekleri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Archivo+Black&family=Space+Grotesk:wght@500;700&family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #e9e7e2; font-family: system-ui, sans-serif; padding: 32px 16px 48px; color: #222; }
  .wrap { display: flex; flex-wrap: wrap; gap: 32px; justify-content: center; }
  .col { width: 340px; }
  .label { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .desc { font-size: 13px; color: #666; margin-bottom: 12px; min-height: 36px; line-height: 1.4; }
  .phone { border-radius: 28px; overflow: hidden; padding: 20px 16px 24px; min-height: 680px; }
  .top { display: flex; justify-content: space-between; align-items: center; }
  .arena { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px; margin-top: 18px; }
  .f { text-align: center; padding: 14px 8px; }
  .f svg { width: 96px; height: 60px; display: block; margin: 0 auto 10px; }
  .f b { display: block; margin-bottom: 10px; }
  button { cursor: pointer; font: inherit; width: 100%; }
  .bar { display: flex; height: 34px; margin-top: 18px; overflow: hidden; }
  .bar i { font-style: normal; display: flex; align-items: center; padding: 0 10px; }
  .bar i:last-child { flex: 1; justify-content: flex-end; }
  .count { text-align: center; margin-top: 8px; }
  .next { margin-top: 22px; }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; margin-top: 8px; }
  .up { padding: 4px 10px; white-space: nowrap; }
  .add { margin-top: 10px; padding: 11px 12px; }

  /* A — Piksel arcade */
  .tA { background: #14142b; color: #f4f0e0; font-family: 'Pixelify Sans', monospace; border-radius: 0; border: 4px solid #000; image-rendering: pixelated; }
  .tA .logo { font-weight: 700; font-size: 20px; color: #ffd23f; letter-spacing: 1px; text-shadow: 3px 3px 0 #d7263d; }
  .tA .round { font-size: 13px; background: #f4f0e0; color: #14142b; padding: 3px 8px; }
  .tA .timer { margin-top: 14px; font-size: 14px; color: #8be9fd; text-align: center; }
  .tA .f { background: #1f1f3d; border: 4px solid #f4f0e0; box-shadow: 4px 4px 0 #000; }
  .tA .f b { font-size: 18px; font-weight: 700; }
  .tA .vs { font-size: 26px; font-weight: 700; color: #ffd23f; text-shadow: 3px 3px 0 #d7263d; }
  .tA button { border: 0; padding: 9px 0; font-weight: 700; font-size: 15px; color: #14142b; box-shadow: 0 4px 0 #000; }
  .tA .f1 button { background: #4cc9f0; } .tA .f2 button { background: #ff5d73; }
  .tA .bar { border: 4px solid #f4f0e0; font-weight: 700; font-size: 16px; color: #14142b; }
  .tA .bar i:first-child { background: #4cc9f0; } .tA .bar i:last-child { background: #ff5d73; }
  .tA .count { font-size: 13px; color: #a9a9c9; }
  .tA h4 { font-size: 17px; color: #ffd23f; font-weight: 700; }
  .tA .row { background: #1f1f3d; border: 2px solid #4a4a7a; font-size: 15px; }
  .tA .up { background: #ffd23f; color: #14142b; font-weight: 700; font-size: 13px; }
  .tA .add { border: 2px dashed #4a4a7a; color: #7a7aa5; font-size: 14px; }

  /* B — Sticker / pop */
  .tB { background: #fff6e0; color: #111; font-family: 'Space Grotesk', sans-serif; border: 3px solid #111; }
  .tB .logo { font-family: 'Archivo Black', sans-serif; font-size: 20px; letter-spacing: -0.5px; }
  .tB .round { font-size: 12px; font-weight: 700; background: #111; color: #fff6e0; padding: 4px 10px; border-radius: 99px; }
  .tB .timer { margin-top: 14px; font-size: 13px; font-weight: 700; text-align: center; background: #ffe14d; border: 2px solid #111; border-radius: 99px; padding: 5px; }
  .tB .f { border: 3px solid #111; border-radius: 18px; box-shadow: 5px 5px 0 #111; }
  .tB .f1 { background: #9ad7ff; transform: rotate(-2deg); } .tB .f2 { background: #ff9fb0; transform: rotate(2deg); }
  .tB .f b { font-family: 'Archivo Black', sans-serif; font-size: 16px; }
  .tB .vs { font-family: 'Archivo Black', sans-serif; font-size: 22px; background: #ffe14d; border: 3px solid #111; border-radius: 50%; width: 48px; height: 48px; display: grid; place-items: center; margin: 0 -14px; z-index: 1; transform: rotate(-8deg); }
  .tB button { background: #111; color: #fff; border: 0; border-radius: 99px; padding: 9px 0; font-weight: 700; font-size: 14px; }
  .tB .bar { border: 3px solid #111; border-radius: 99px; font-family: 'Archivo Black', sans-serif; font-size: 15px; margin-top: 24px; }
  .tB .bar i:first-child { background: #9ad7ff; border-right: 3px solid #111; } .tB .bar i:last-child { background: #ff9fb0; }
  .tB .count { font-size: 13px; font-weight: 500; color: #555; }
  .tB h4 { font-family: 'Archivo Black', sans-serif; font-size: 17px; }
  .tB .row { background: #fff; border: 2px solid #111; border-radius: 14px; font-size: 14px; font-weight: 700; box-shadow: 3px 3px 0 #111; }
  .tB .up { background: #ffe14d; border: 2px solid #111; border-radius: 99px; font-size: 12px; font-weight: 700; }
  .tB .add { border: 2px dashed #111; border-radius: 14px; color: #777; font-size: 14px; font-weight: 500; }

  /* C — Yumuşak şeker */
  .tC { background: #fdf1f5; color: #3b2a4a; font-family: 'Fredoka', sans-serif; }
  .tC .logo { font-weight: 700; font-size: 21px; color: #7b4bd6; }
  .tC .round { font-size: 13px; font-weight: 600; background: #fff; color: #7b4bd6; padding: 4px 12px; border-radius: 99px; }
  .tC .timer { margin-top: 14px; font-size: 14px; text-align: center; color: #8a7799; }
  .tC .f { background: #fff; border-radius: 26px; box-shadow: 0 8px 0 #f0d9e4; }
  .tC .f b { font-size: 18px; font-weight: 600; }
  .tC .vs { font-size: 20px; font-weight: 700; color: #fff; background: #7b4bd6; border-radius: 50%; width: 44px; height: 44px; display: grid; place-items: center; margin: 0 -12px; z-index: 1; }
  .tC button { border: 0; border-radius: 99px; padding: 10px 0; font-weight: 600; font-size: 15px; color: #fff; }
  .tC .f1 button { background: #4aa8ff; box-shadow: 0 4px 0 #2f84d6; } .tC .f2 button { background: #ff6f91; box-shadow: 0 4px 0 #d94f72; }
  .tC .bar { border-radius: 99px; font-weight: 700; font-size: 16px; color: #fff; margin-top: 26px; }
  .tC .bar i:first-child { background: #4aa8ff; } .tC .bar i:last-child { background: #ff6f91; }
  .tC .count { font-size: 14px; color: #8a7799; }
  .tC h4 { font-size: 18px; font-weight: 600; }
  .tC .row { background: #fff; border-radius: 18px; font-size: 15px; font-weight: 600; }
  .tC .up { background: #efe6ff; color: #7b4bd6; border-radius: 99px; font-size: 13px; font-weight: 600; }
  .tC .add { background: #f8e3ec; border-radius: 18px; color: #a58fb0; font-size: 15px; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" shape-rendering="crispEdges">
  <symbol id="pingui" viewBox="0 0 64 40">
    <rect x="4" y="6" width="56" height="28" fill="#3b1f14"/>
    <rect x="8" y="12" width="48" height="16" fill="#fffaf0"/>
    <rect x="8" y="18" width="48" height="4" fill="#5a2d1a"/>
    <rect x="8" y="8" width="20" height="2" fill="#6b3a25"/>
  </symbol>
  <symbol id="sutdilimi" viewBox="0 0 64 40">
    <rect x="4" y="6" width="56" height="8" fill="#7a4a2b"/>
    <rect x="4" y="14" width="56" height="12" fill="#fffaf0"/>
    <rect x="4" y="26" width="56" height="8" fill="#7a4a2b"/>
    <rect x="12" y="9" width="3" height="2" fill="#5c361e"/><rect x="30" y="8" width="3" height="2" fill="#5c361e"/><rect x="46" y="10" width="3" height="2" fill="#5c361e"/>
    <rect x="18" y="29" width="3" height="2" fill="#5c361e"/><rect x="38" y="30" width="3" height="2" fill="#5c361e"/>
  </symbol>
</svg>

<div class="wrap" id="wrap"></div>

<template id="screen">
  <div class="top"><span class="logo">ABUR CUBUR VS</span><span class="round">1. raunt</span></div>
  <div class="timer">Bitmesine 2 gün 14 saat 03 dk</div>
  <div class="arena">
    <div class="f f1"><svg><use href="#pingui"/></svg><b>Pingui</b><button>Oy ver</button></div>
    <div class="vs">VS</div>
    <div class="f f2"><svg><use href="#sutdilimi"/></svg><b>Süt Dilimi</b><button>Oy ver</button></div>
  </div>
  <div class="bar"><i style="width:54%">%54</i><i>%46</i></div>
  <div class="count">12.480 oy · İstanbul Pingui diyor</div>
  <div class="next">
    <h4>Sonraki VS ne olsun?</h4>
    <div class="row"><span>Albeni vs Metro</span><span class="up">▲ 312</span></div>
    <div class="row"><span>Çokoprens vs Biskrem</span><span class="up">▲ 287</span></div>
    <div class="row"><span>Ruffles vs Doritos</span><span class="up">▲ 190</span></div>
    <div class="add">+ Kendi kapışmanı öner</div>
  </div>
</template>

<script>
  const options = [
    ['A', 'Piksel arcade', 'Dövüş oyunu havası: koyu zemin, piksel font, sert gölgeler.'],
    ['B', 'Sticker pop', 'Kalın çizgili, çıkartma gibi kartlar. Canlı ama düzenli.'],
    ['C', 'Yumuşak şeker', 'Pastel, yuvarlak, mobil oyun menüsü gibi. En sakin olanı.'],
  ];
  const tpl = document.getElementById('screen');
  for (const [k, name, desc] of options) {
    const col = document.createElement('div');
    col.className = 'col';
    col.innerHTML = `<div class="label">${k} — ${name}</div><div class="desc">${desc}</div><div class="phone t${k}"></div>`;
    col.querySelector('.phone').appendChild(tpl.content.cloneNode(true));
    document.getElementById('wrap').appendChild(col);
  }
</script>
</body>
</html>
